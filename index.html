<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货币转换器</title>
    
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="converter-card">
    <h1>货币转换器</h1>
    
    <div class="group">
        <label for="amount">金额</label>
        <input type="number" id="amount" value="1.00" step="0.01">
    </div>

    <div class="group">
        <label for="from-currency">从</label>
        <select id="from-currency">
            <option value="CNY">人民币 (CNY)</option>
            <option value="USD">美元 (USD)</option>
            <option value="EUR">欧元 (EUR)</option>
            <option value="JPY">日元 (JPY)</option>
        </select>
    </div>

    <div class="swap-container">
        <button id="swap-btn" aria-label="交换货币">⇅</button>
    </div>

    <div class="group">
        <label for="to-currency">到</label>
        <select id="to-currency">
            <option value="USD">美元 (USD)</option>
            <option value="CNY" selected>人民币 (CNY)</option>
            <option value="EUR">欧元 (EUR)</option>
            <option value="JPY">日元 (JPY)</option>
        </select>
    </div>

    <div class="result-box">
        <div id="result" class="result-value">0.00</div>
        <div class="result-label" id="rate-info">汇率加载中...</div>
    </div>
</div>

<script>
    const rates = {
        CNY: 1,
        USD: 0.14,
        EUR: 0.13,
        JPY: 20.50
    };

    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from-currency');
    const toSelect = document.getElementById('to-currency');
    const swapBtn = document.getElementById('swap-btn');
    const resultDisplay = document.getElementById('result');
    const rateDisplay = document.getElementById('rate-info');

    function convert() {
        const amount = parseFloat(amountInput.value);
        const from = fromSelect.value;
        const to = toSelect.value;

        // Convert to base (CNY) then to target
        const amountInCNY = amount / rates[from];
        const result = amountInCNY * rates[to];

        resultDisplay.textContent = result.toLocaleString('zh-CN', { style: 'currency', currency: to });
        
        const exchangeRate = (rates[to] / rates[from]).toFixed(4);
        rateDisplay.textContent = `1 ${from} = ${exchangeRate} ${to}`;
    }

    swapBtn.addEventListener('click', () => {
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        convert();
    });

    [amountInput, fromSelect, toSelect].forEach(el => {
        el.addEventListener('input', convert);
    });

    // Initial run
    convert();
</script>

</body>
</html>
